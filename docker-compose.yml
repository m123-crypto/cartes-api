services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: cartes
      POSTGRES_PASSWORD: cartes
      POSTGRES_DB: cartes
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro

volumes:
  pgdata:
